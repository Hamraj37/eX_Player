name: Android Release APK

on:
  workflow_dispatch:
    inputs:
      whats_new:
        description: "What's new (leave blank to auto-generate from git commits)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract Version Name
        id: get_version
        run: |
          VERSION_NAME=$(grep -E 'versionName\s+"([^"]+)"' app/build.gradle | sed -E 's/.*versionName\s+"([^"]+)".*/\1/')
          echo "Extracted Version Name: $VERSION_NAME"
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "tag_name=v$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Prepare Release Notes
        id: release_notes
        run: |
          if [ -n "${{ inputs.whats_new }}" ]; then
            NOTES="${{ inputs.whats_new }}"
          elif [ -f "RELEASE_NOTES.md" ]; then
            NOTES=$(cat RELEASE_NOTES.md)
          elif [ -f "whats_new.txt" ]; then
            NOTES=$(cat whats_new.txt)
          else
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              echo "Fetching commits since tag: $LAST_TAG"
              NOTES=$(git log --oneline --no-merges ${LAST_TAG}..HEAD | sed -E 's/^[a-f0-9]+ /- /')
            else
              echo "No previous tag found, fetching recent commits"
              NOTES=$(git log --oneline --no-merges -n 10 | sed -E 's/^[a-f0-9]+ /- /')
            fi
            if [ -z "$NOTES" ]; then
              NOTES="Bug fixes and performance improvements."
            fi
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: Release ${{ steps.get_version.outputs.tag_name }}
          body: |
            ## What's New 🚀

            ${{ steps.release_notes.outputs.notes }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
